rules:
  - id: java-ldap-injection-sinks
    options:
      lib: true
    tags:
      - ldap-injection-sink
    severity: NOTE
    message: Call of LDAP injection-sensitive function with untrusted data.
    metadata:
      provenance: https://gitlab.com/gitlab-org/security-products/sast-rules/-/blob/main/java/inject/rule-LDAPInjection.yml
    languages:
      - java
    mode: taint
    pattern-sinks:
      - patterns:
          - pattern: new javax.naming.ldap.LdapName(..., $UNTRUSTED, ...)
          - focus-metavariable: $UNTRUSTED
      - patterns:
          - pattern: (javax.naming.directory.Context $C).lookup(..., $UNTRUSTED, ...)
          - focus-metavariable: $UNTRUSTED
      - patterns:
          - pattern: (javax.naming.Context $C).lookup(..., $UNTRUSTED, ...)
          - focus-metavariable: $UNTRUSTED
      - patterns:
          - pattern: (com.unboundid.ldap.sdk.LDAPConnection $C).search($UNTRUSTED, ...)
          - focus-metavariable: $UNTRUSTED
      - patterns:
          - pattern-either:
              - pattern: ($CTXTYPE $CTX).lookup(..., $UNTRUSTED, ...)
              - pattern: ($CTXTYPE $CTX).search($UNTRUSTED, ...)
              - pattern: ($CTXTYPE $CTX).search($NAME, $UNTRUSTED, ...)
          - metavariable-pattern:
              metavariable: $CTXTYPE
              pattern-either:
                - pattern: javax.naming.directory.DirContext
                - pattern: javax.naming.directory.InitialDirContext
                - pattern: javax.naming.ldap.LdapContext
                - pattern: javax.naming.event.EventDirContext
                - pattern: com.sun.jndi.ldap.LdapCtx
          - focus-metavariable: $UNTRUSTED
      - patterns:
          - pattern-either:
              - pattern: ($CTXTYPE $CTX).list($UNTRUSTED, ...)
              - pattern: ($CTXTYPE $CTX).lookup($UNTRUSTED, ...)
              - pattern: ($CTXTYPE $CTX).search($UNTRUSTED, ...)
              - pattern: ($CTXTYPE $CTX).search($NAME, $UNTRUSTED, ...)
          - metavariable-pattern:
              metavariable: $CTXTYPE
              pattern-either:
                - pattern: org.springframework.ldap.core.LdapTemplate
                - pattern: org.springframework.ldap.core.LdapOperations
          - focus-metavariable: $UNTRUSTED

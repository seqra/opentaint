rules:
  - id: java-path-traversal-sinks
    options:
      lib: true
    tags:
      - path-traversal-sink
    severity: NOTE
    message: Use a file with untrusted path
    metadata:
      short-description: Unvalidated user data flows into template engine
      provenance: https://github.com/semgrep/semgrep-rules/blob/develop/java/spring/security/injection/tainted-file-path.yaml
    languages:
      - java
    mode: taint
    pattern-sanitizers:
      - pattern: org.apache.commons.io.FilenameUtils.getName(...)
      - pattern: org.apache.commons.io.FilenameUtils.getExtension(...)
      - pattern: io.github.pixee.security.Filenames.toSimpleFileName(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: new java.io.FileReader($UNTRUSTED, ...)
              - pattern: new java.io.FileWriter($UNTRUSTED, ...)
              - pattern: new java.io.FileInputStream($UNTRUSTED)
              - pattern: new java.io.FileOutputStream($UNTRUSTED, ...)
              - pattern: new java.io.RandomAccessFile($UNTRUSTED, ...)
              - pattern: java.io.File.createTempFile($_, $_, $UNTRUSTED)

              - pattern: (java.io.File $UNTRUSTED).exists()
              - pattern: (java.io.File $UNTRUSTED).isFile()
              - pattern: (java.io.File $UNTRUSTED).isDirectory()
              - pattern: (java.io.File $UNTRUSTED).delete()
              - pattern: (java.io.File $UNTRUSTED).deleteOnExit()
              - pattern: (java.io.File $UNTRUSTED).createNewFile()
              - pattern: (java.io.File $UNTRUSTED).mkdir()
              - pattern: (java.io.File $UNTRUSTED).mkdirs()
              - pattern: (java.io.File $UNTRUSTED).setExecutable(...)
              - pattern: (java.io.File $UNTRUSTED).setReadable(...)
              - pattern: (java.io.File $UNTRUSTED).setWritable(...)

              - pattern: java.nio.file.Files.copy(..., (java.nio.file.Path $UNTRUSTED), ...)
              - pattern: java.nio.file.Files.createDirectories($UNTRUSTED, ...)
              - pattern: java.nio.file.Files.createDirectory($UNTRUSTED, ...)
              - pattern: java.nio.file.Files.createFile($UNTRUSTED, ...)
              - pattern: java.nio.file.Files.createLink(..., $UNTRUSTED, ...)
              - pattern: java.nio.file.Files.createSymbolicLink(..., $UNTRUSTED, ...)
              - pattern: java.nio.file.Files.createTempFile((java.nio.file.Path $UNTRUSTED), ...)
              - pattern: java.nio.file.Files.createTempDirectory((java.nio.file.Path $UNTRUSTED), ...)
              - pattern: java.nio.file.Files.delete($UNTRUSTED)
              - pattern: java.nio.file.Files.deleteIfExists($UNTRUSTED)
              - pattern: java.nio.file.Files.exists($UNTRUSTED, ...)
              - pattern: java.nio.file.Files.find($UNTRUSTED, ...)
              - pattern: java.nio.file.Files.move(..., $UNTRUSTED, ...)
              - pattern: java.nio.file.Files.newBufferedReader($UNTRUSTED, ...)
              - pattern: java.nio.file.Files.newBufferedWriter($UNTRUSTED, ...)
              - pattern: java.nio.file.Files.newByteChannel($UNTRUSTED, ...)
              - pattern: java.nio.file.Files.newDirectoryStream($UNTRUSTED, ...)
              - pattern: java.nio.file.Files.newInputStream($UNTRUSTED, ...)
              - pattern: java.nio.file.Files.newOutputStream($UNTRUSTED, ...)
              - pattern: java.nio.file.Files.notExists($UNTRUSTED, ...)
              - pattern: java.nio.file.Files.readAllBytes($UNTRUSTED, ...)
              - pattern: java.nio.file.Files.readAllLines($UNTRUSTED, ...)
              - pattern: java.nio.file.Files.readSymbolicLink($UNTRUSTED, ...)
              - pattern: java.nio.file.Files.setLastModifiedTime($UNTRUSTED, ...)
              - pattern: java.nio.file.Files.setOwner($UNTRUSTED, ...)
              - pattern: java.nio.file.Files.setPosixFilePermissions($UNTRUSTED, ...)
              - pattern: java.nio.file.Files.walk($UNTRUSTED, ...)
              - pattern: java.nio.file.Files.walkFileTree($UNTRUSTED, ...)
              - pattern: java.nio.file.Files.write($UNTRUSTED, ...)

              - pattern: org.apache.commons.io.FileUtils.cleanDirectory(..., $UNTRUSTED, ...)
              - pattern: org.apache.commons.io.FileUtils.copyDirectory(..., $UNTRUSTED, ...)
              - pattern: org.apache.commons.io.FileUtils.copyFile(..., $UNTRUSTED, ...)
              - pattern: org.apache.commons.io.FileUtils.copyFileToDirectory(..., $UNTRUSTED, ...)
              - pattern: org.apache.commons.io.FileUtils.delete($UNTRUSTED)
              - pattern: org.apache.commons.io.FileUtils.deleteDirectory($UNTRUSTED)
              - pattern: org.apache.commons.io.FileUtils.deleteQuietly($UNTRUSTED)
              - pattern: org.apache.commons.io.FileUtils.forceDelete($UNTRUSTED)
              - pattern: org.apache.commons.io.FileUtils.forceDeleteOnExit($UNTRUSTED)
              - pattern: org.apache.commons.io.FileUtils.forceMkDir($UNTRUSTED)
              - pattern: org.apache.commons.io.FileUtils.forceMkDirParent($UNTRUSTED)
              - pattern: org.apache.commons.io.FileUtils.iterateFiles($UNTRUSTED, ...)
              - pattern: org.apache.commons.io.FileUtils.iterateFilesAndDirs($UNTRUSTED, ...)
              - pattern: org.apache.commons.io.FileUtils.listFiles($UNTRUSTED, ...)
              - pattern: org.apache.commons.io.FileUtils.listFilesAndDirs($UNTRUSTED, ...)
              - pattern: org.apache.commons.io.FileUtils.moveFile(..., $UNTRUSTED, ...)
              - pattern: org.apache.commons.io.FileUtils.moveToDirectory(..., $UNTRUSTED, ...)
              - pattern: org.apache.commons.io.FileUtils.newOutputStream($UNTRUSTED, ...)
              - pattern: org.apache.commons.io.FileUtils.openOutputStream($UNTRUSTED, ...)
              - pattern: org.apache.commons.io.FileUtils.openInputStream($UNTRUSTED, ...)
              - pattern: org.apache.commons.io.FileUtils.readFileToByteArray($UNTRUSTED, ...)
              - pattern: org.apache.commons.io.FileUtils.readFileToString($UNTRUSTED, ...)
              - pattern: org.apache.commons.io.FileUtils.readLines($UNTRUSTED, ...)
              - pattern: org.apache.commons.io.FileUtils.streamFiles($UNTRUSTED, ...)
              - pattern: org.apache.commons.io.FileUtils.touch($UNTRUSTED, ...)
              - pattern: org.apache.commons.io.FileUtils.write($UNTRUSTED, ...)
              - pattern: org.apache.commons.io.FileUtils.writeByteArrayToFile($UNTRUSTED, ...)
              - pattern: org.apache.commons.io.FileUtils.writeLines($UNTRUSTED, ...)
              - pattern: org.apache.commons.io.FileUtils.writeStringToFile($UNTRUSTED, ...)

              - pattern: new org.springframework.core.io.ClassPathResource($UNTRUSTED, ...)
              - pattern: org.springframework.util.ResourceUtils.getFile($UNTRUSTED, ...)
              - pattern: org.springframework.util.FileSystemUtils.$FILE_SYSTEM_UTILS_METHOD(..., $UNTRUSTED, ...)
              - pattern: org.springframework.util.FileCopyUtils.$FILE_COPY_UTILS_METHOD(..., $UNTRUSTED, ...)
              - pattern: new org.springframework.core.io.FileSystemResource($UNTRUSTED)

              - pattern: new javax.xml.transform.StreamSource($UNTRUSTED, ...)
              - pattern: new javax.activation.FileDataSource($UNTRUSTED, ...)
              - patterns:
                  - pattern-either:
                      - pattern: (Class $C).$CLASS_FUNC($UNTRUSTED)
                      - pattern: (ClassLoader $CL).$CLASS_FUNC($UNTRUSTED)
                  - metavariable-pattern:
                      metavariable: $CLASS_FUNC
                      pattern-either:
                        - pattern: getResourceAsStream
                        - pattern: getResource
                        - pattern: getResources
                        - pattern: resources
          - focus-metavariable: $UNTRUSTED

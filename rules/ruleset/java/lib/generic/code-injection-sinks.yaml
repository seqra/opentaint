rules:
  - id: ognl-injection-sinks
    options:
      lib: true
    tags:
      - ognl-injection-sink
    severity: NOTE
    message: Untrusted input reaches OGNL expression
    metadata:
      provenance: https://find-sec-bugs.github.io/bugs.htm#OGNL_INJECTION
    languages:
      - java
    patterns:
      - pattern-either:
          - pattern: ognl.Ognl.getValue($UNTRUSTED,...);
          - pattern: (com.opensymphony.xwork2.ognl.OgnlReflectionProvider $P).getGetMethod($T, $UNTRUSTED,...);
          - pattern: (com.opensymphony.xwork2.ognl.OgnlReflectionProvider $P).getSetMethod($T, $UNTRUSTED,...);
          - pattern: (com.opensymphony.xwork2.ognl.OgnlReflectionProvider $P).getField($T, $UNTRUSTED,...);
          - pattern: (com.opensymphony.xwork2.ognl.OgnlReflectionProvider $P).setProperties($UNTRUSTED,...);
          - pattern: (com.opensymphony.xwork2.ognl.OgnlReflectionProvider $P).setProperty($UNTRUSTED,...);
          - pattern: (com.opensymphony.xwork2.ognl.OgnlReflectionProvider $P).getValue($UNTRUSTED,...);
          - pattern: (com.opensymphony.xwork2.ognl.OgnlReflectionProvider $P).setValue($UNTRUSTED,...);
          - pattern: (com.opensymphony.xwork2.util.reflection.ReflectionProvider $P).getGetMethod($T, $UNTRUSTED,...);
          - pattern: (com.opensymphony.xwork2.util.reflection.ReflectionProvider $P).getSetMethod($T, $UNTRUSTED,...);
          - pattern: (com.opensymphony.xwork2.util.reflection.ReflectionProvider $P).getField($T, $UNTRUSTED,...);
          - pattern: (com.opensymphony.xwork2.util.reflection.ReflectionProvider $P).setProperties($UNTRUSTED,...);
          - pattern: (com.opensymphony.xwork2.util.reflection.ReflectionProvider $P).setProperty($UNTRUSTED,...);
          - pattern: (com.opensymphony.xwork2.util.reflection.ReflectionProvider $P).getValue($UNTRUSTED,...);
          - pattern: (com.opensymphony.xwork2.util.reflection.ReflectionProvider $P).setValue($UNTRUSTED,...);
          - pattern: (com.opensymphony.xwork2.util.reflection.ReflectionProvider $P).translateVariables($UNTRUSTED,...);
          - pattern: com.opensymphony.xwork2.util.TextParseUtil.translateVariables($UNTRUSTED, ...);
          - pattern: com.opensymphony.xwork2.util.TextParseUtil.translateVariablesCollection($UNTRUSTED,...);
          - pattern: com.opensymphony.xwork2.util.TextParseUtil.shallBeIncluded($UNTRUSTED,...);
    # TODO: commaDelimitedStringToSet is propagator!
          - pattern: com.opensymphony.xwork2.util.TextParseUtil.commaDelimitedStringToSet($UNTRUSTED,...);
          - pattern: (com.opensymphony.xwork2.util.OgnlTextParser $P).evaluate($UNTRUSTED,...);
          - pattern: (com.opensymphony.xwork2.util.OgnlTextParser $P).setProperties($UNTRUSTED,...);
          - pattern: (com.opensymphony.xwork2.ognl.OgnlUtil $P).setProperty($UNTRUSTED,...);
          - pattern: (com.opensymphony.xwork2.ognl.OgnlUtil $P).getValue($UNTRUSTED,...);
          - pattern: (com.opensymphony.xwork2.ognl.OgnlUtil $P).setValue($UNTRUSTED,...);
          - pattern: (com.opensymphony.xwork2.ognl.OgnlUtil $P).callMethod($UNTRUSTED,...);
          - pattern: (com.opensymphony.xwork2.ognl.OgnlUtil $P).compile($UNTRUSTED,...);
          - pattern: (org.apache.struts2.util.VelocityStrutsUtil $P).evaluate($UNTRUSTED,...);
          - pattern: (org.apache.struts2.util.StrutsUtil $P).isTrue($UNTRUSTED,...);
          - pattern: (org.apache.struts2.util.StrutsUtil $P).findString($UNTRUSTED,...);
          - pattern: (org.apache.struts2.util.StrutsUtil $P).findValue($UNTRUSTED,...);
          - pattern: (org.apache.struts2.util.StrutsUtil $P).getText($UNTRUSTED,...);
          - pattern: (org.apache.struts2.util.StrutsUtil $P).translateVariables($UNTRUSTED,...);
          - pattern: (org.apache.struts2.util.StrutsUtil $P).makeSelectList($UNTRUSTED,...);
          - pattern: (org.apache.struts2.views.jsp.ui.OgnlTool $P).findValue($UNTRUSTED,...);
          - pattern: (com.opensymphony.xwork2.util.ValueStack $P).findString($UNTRUSTED,...);
          - pattern: (com.opensymphony.xwork2.util.ValueStack $P).findValue($UNTRUSTED,...);
          - pattern: (com.opensymphony.xwork2.util.ValueStack $P).setValue($UNTRUSTED,...);
          - pattern: (com.opensymphony.xwork2.util.ValueStack $P).setParameter($UNTRUSTED,...);

  - id: dangerous-groovy-shell
    options:
      lib: true
    tags:
      - groovy-injection-sink
    severity: NOTE
    message: Groovy shell run of externally-manipulated script
    metadata:
      provenance: https://find-sec-bugs.github.io/bugs.htm#GROOVY_SHELL
    languages:
      - java
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: |
                  $SHELL.parse($UNTRUSTED)
              - pattern: |
                  $SHELL.evaluate($UNTRUSTED)
              - pattern: |
                  $SHELL.parseClass($UNTRUSTED)
          - pattern-either:
              - pattern-inside: |
                  groovy.lang.GroovyShell $SHELL = ...;
                  ...
              - pattern-inside: |
                  groovy.lang.GroovyClassLoader $SHELL = ...;
                  ...
      - pattern: groovy.util.Eval.me($UNTRUSTED)
      - pattern: groovy.util.Eval.x($X, $UNTRUSTED)
      - pattern: groovy.util.Eval.xy($X, $Y, $UNTRUSTED)
      - pattern: groovy.util.Eval.xyz($X, $Y, $Z, $UNTRUSTED)

  - id: dangerous-script-engine-eval
    options:
      lib: true
    tags:
      - script-engine-injection-sink
    severity: NOTE
    message: Risky code evaluation with user-controled value
    metadata:
      provenance: https://find-sec-bugs.github.io/bugs.htm#SCRIPT_ENGINE_INJECTION
    languages:
      - java
    pattern-either:
      - pattern: (javax.script.ScriptEngine $SE).eval($UNTRUSTED)
      - pattern: (javax.script.Invocable $INVC).invokeFunction(..., $UNTRUSTED)
      - pattern: (javax.script.Invocable $INVC).invokeMethod(..., $UNTRUSTED)

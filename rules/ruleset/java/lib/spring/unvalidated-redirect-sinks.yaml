rules:
  - id: spring-unvalidated-redirect-sinks
    options:
      lib: true
    tags:
      - unvalidated-redirect-sink
    severity: NOTE
    message: Potential redirect to an untrusted URL
    metadata:
      provenance: https://github.com/semgrep/semgrep-rules/blob/develop/java/spring/security/audit/spring-unvalidated-redirect.yaml
    languages:
      - java
    mode: taint
    pattern-sanitizers:
      - patterns:
          - pattern: $*URI = (HttpServletRequest $REQ).getRequestURI();
          - focus-metavariable: $URI
    pattern-sinks:
      - patterns:
          - pattern: new RedirectView($UNTRUSTED);
          - focus-metavariable: $UNTRUSTED
      - patterns:
          - pattern: new ModelAndView("redirect:" + $UNTRUSTED);
          - focus-metavariable: $UNTRUSTED
      - patterns:
          - pattern: |
              @$ANNOTATION(...)
              $RETURNTYPE $METHOD(...) {
                ...
                return "$REDIRECT" + $*UNTRUSTED;
                ...
              }

          - metavariable-regex:
              metavariable: $REDIRECT
              regex: "redirect:.*"

          - metavariable-pattern:
              metavariable: $ANNOTATION
              patterns:
                - pattern-either:
                    - pattern: RequestMapping
                    - pattern: DeleteMapping
                    - pattern: GetMapping
                    - pattern: PatchMapping
                    - pattern: PostMapping
                    - pattern: PutMapping
          - focus-metavariable: $UNTRUSTED

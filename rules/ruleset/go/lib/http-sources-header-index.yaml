rules:
  - id: http-sources-header-index
    options:
      lib: true
    severity: NOTE
    message: Untrusted beego request-header value source
    metadata:
      short-description: Untrusted beego request-header value source
      provenance: https://github.com/seqra/opentaint/tree/main/skills
    languages:
      - go
    mode: taint
    pattern-sources:
      - label: "$UNTRUSTED"
        pattern: |
          import context "github.com/beego/beego/v2/server/web/context"
          ($X : *context.BeegoInput).Header($K)

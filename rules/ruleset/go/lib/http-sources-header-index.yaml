rules:
  - id: http-sources-header-index
    options: {lib: true}
    languages: [go]
    severity: NOTE
    message: Untrusted header-map source
    mode: taint
    pattern-sources:
      - label: "$UNTRUSTED"
        pattern: |
          import context "github.com/beego/beego/v2/server/web/context"
          ($X : *context.BeegoInput).Header($K)

rules:
  - id: cmdi-sinks
    options:
      lib: true
    tags:
      - command-injection-sink
    severity: NOTE
    message: Untrusted data reaches an OS command execution API
    metadata:
      short-description: OS command execution sink
      provenance: https://github.com/seqra/opentaint/tree/main/skills
    languages:
      - go
    mode: taint
    pattern-sinks:
      # Tainted command name reaches process execution.
      - patterns:
          - pattern-inside: |
              import "os/exec"
              import "os"
              import "syscall"
              ...
          - pattern-either:
              - pattern: "exec.Command($UNTRUSTED, ...)"
              - pattern: "exec.CommandContext($CTX, $UNTRUSTED, ...)"
              - pattern: "exec.LookPath($UNTRUSTED)"
              - pattern: "os.StartProcess($UNTRUSTED, ...)"
              - pattern: "syscall.Exec($UNTRUSTED, ...)"
              - pattern: "syscall.ForkExec($UNTRUSTED, ...)"
              - pattern: "syscall.StartProcess($UNTRUSTED, ...)"
          - focus-metavariable: $UNTRUSTED
      # Shell interpreter invoked with a literal command name; a tainted argument is the injection point.
      - patterns:
          - pattern-inside: |
              import "os/exec"
              ...
          - pattern-either:
              - pattern: "exec.Command(\"$NAME\", ..., $*UNTRUSTED, ...)"
              - pattern: "exec.CommandContext($CTX, \"$NAME\", ..., $*UNTRUSTED, ...)"
          - metavariable-regex:
              metavariable: $NAME
              regex: sh
          - focus-metavariable: $UNTRUSTED
      # Execution of a *exec.Cmd whose argv/env already carries taint.
      - patterns:
          - pattern-inside: |
              import "os/exec"
              ...
          - pattern-either:
              - pattern: "($UNTRUSTED : *exec.Cmd).CombinedOutput()"
              - pattern: "($UNTRUSTED : *exec.Cmd).Run()"
              - pattern: "($UNTRUSTED : *exec.Cmd).Output()"
              - pattern: "($UNTRUSTED : *exec.Cmd).Start()"
          - focus-metavariable: $UNTRUSTED

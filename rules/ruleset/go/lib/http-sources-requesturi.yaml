rules:
  - id: http-sources-requesturi
    options:
      lib: true
    tags:
      - request-uri-untrusted-data-source
    severity: NOTE
    message: Untrusted request URI source
    metadata:
      short-description: Untrusted request URI source (*http.Request.RequestURI)
      provenance: https://github.com/seqra/opentaint/tree/main/skills
    languages:
      - go
    mode: taint
    pattern-sources:
      - label: "$UNTRUSTED"
        pattern: |
          import "net/http"
          ($R : *http.Request).RequestURI

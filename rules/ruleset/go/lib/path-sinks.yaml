rules:
  - id: path-sinks
    options:
      lib: true
    severity: NOTE
    message: Untrusted data reaches a filesystem path API
    metadata:
      short-description: Filesystem path sink
      provenance: https://github.com/seqra/opentaint/tree/main/skills
    languages:
      - go
    mode: taint
    pattern-sinks:
      - patterns:
          - pattern-inside: |
              import "os"
              import "io/ioutil"
              import "net/http"
              ...
          - pattern-either:
              - pattern: "os.Open($UNTRUSTED)"
              - pattern: "os.OpenFile($UNTRUSTED, ...)"
              - pattern: "os.Create($UNTRUSTED)"
              - pattern: "os.CreateTemp($UNTRUSTED, $PAT)"
              - pattern: "os.CreateTemp($DIR, $UNTRUSTED)"
              - pattern: "os.MkdirTemp($UNTRUSTED, $PAT)"
              - pattern: "os.MkdirTemp($DIR, $UNTRUSTED)"
              - pattern: "os.Mkdir($UNTRUSTED, ...)"
              - pattern: "os.MkdirAll($UNTRUSTED, ...)"
              - pattern: "os.Remove($UNTRUSTED)"
              - pattern: "os.RemoveAll($UNTRUSTED)"
              - pattern: "os.ReadFile($UNTRUSTED)"
              - pattern: "os.WriteFile($UNTRUSTED, ...)"
              - pattern: "os.ReadDir($UNTRUSTED)"
              - pattern: "os.Stat($UNTRUSTED)"
              - pattern: "os.Lstat($UNTRUSTED)"
              - pattern: "os.Truncate($UNTRUSTED, ...)"
              - pattern: "os.Chdir($UNTRUSTED)"
              - pattern: "os.Chmod($UNTRUSTED, ...)"
              - pattern: "os.Chown($UNTRUSTED, ...)"
              - pattern: "os.Lchown($UNTRUSTED, ...)"
              - pattern: "os.Chtimes($UNTRUSTED, ...)"
              - pattern: "os.Readlink($UNTRUSTED)"
              - pattern: "os.Rename($UNTRUSTED, $B)"
              - pattern: "os.Rename($A, $UNTRUSTED)"
              - pattern: "os.Link($UNTRUSTED, $B)"
              - pattern: "os.Link($A, $UNTRUSTED)"
              - pattern: "os.Symlink($UNTRUSTED, $B)"
              - pattern: "os.Symlink($A, $UNTRUSTED)"
              - pattern: "os.DirFS($UNTRUSTED)"
              - pattern: "ioutil.ReadFile($UNTRUSTED)"
              - pattern: "ioutil.WriteFile($UNTRUSTED, ...)"
              - pattern: "ioutil.ReadDir($UNTRUSTED)"
              - pattern: "ioutil.TempFile($UNTRUSTED, $PAT)"
              - pattern: "ioutil.TempFile($DIR, $UNTRUSTED)"
              - pattern: "ioutil.TempDir($UNTRUSTED, $PAT)"
              - pattern: "ioutil.TempDir($DIR, $UNTRUSTED)"
              - pattern: "http.ServeFile($W, $R, $UNTRUSTED)"
          - focus-metavariable: $UNTRUSTED

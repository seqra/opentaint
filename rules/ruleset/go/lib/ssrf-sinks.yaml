rules:
  - id: ssrf-sinks
    options:
      lib: true
    severity: NOTE
    message: Untrusted data reaches an outbound HTTP request API
    metadata:
      short-description: Outbound HTTP request sink
      provenance: https://github.com/seqra/opentaint/tree/main/skills
    languages:
      - go
    mode: taint
    pattern-sinks:
      - patterns:
          - pattern-inside: |
              import "net/http"
              ...
          - pattern-either:
              - pattern: "http.Get($U)"
              - pattern: "http.Head($U)"
              - pattern: "http.Post($U, ...)"
              - pattern: "http.PostForm($U, ...)"
              - pattern: "($C : *http.Client).Get($U)"
              - pattern: "($C : *http.Client).Head($U)"
              - pattern: "($C : *http.Client).Post($U, ...)"
              - pattern: "($C : *http.Client).PostForm($U, ...)"
              - pattern: "http.NewRequest($M, $U, ...)"
              - pattern: "http.NewRequestWithContext($CTX, $M, $U, ...)"
          - focus-metavariable: $U

rules:
  - id: ssti-sinks
    options:
      lib: true
    tags:
      - ssti-sink
    severity: NOTE
    message: Untrusted data reaches a template-source parse API
    metadata:
      short-description: Template source parse sink
      provenance: https://github.com/seqra/opentaint/tree/main/skills
    languages:
      - go
    mode: taint
    pattern-sinks:
      - patterns:
          - pattern-inside: |
              import template "html/template"
              ...
          - pattern-either:
              - pattern: "template.New($N).Parse($UNTRUSTED)"
              - pattern: "template.Must(template.New($N).Parse($UNTRUSTED))"
              - pattern: "($T : *template.Template).Parse($UNTRUSTED)"
              - pattern: "template.New($N).ParseFiles($UNTRUSTED, ...)"
              - pattern: "template.New($N).ParseGlob($UNTRUSTED)"
          - focus-metavariable: $UNTRUSTED
      - patterns:
          - pattern-inside: |
              import template "text/template"
              ...
          - pattern-either:
              - pattern: "template.New($N).Parse($UNTRUSTED)"
              - pattern: "template.Must(template.New($N).Parse($UNTRUSTED))"
              - pattern: "($T : *template.Template).Parse($UNTRUSTED)"
              - pattern: "template.New($N).ParseFiles($UNTRUSTED, ...)"
              - pattern: "template.New($N).ParseGlob($UNTRUSTED)"
          - focus-metavariable: $UNTRUSTED

rules:
  - id: ssrf
    languages: [go]
    severity: ERROR
    message: Tainted user input flows into a server-side HTTP request (SSRF)
    metadata:
      cwe: CWE-918
      short-description: Server-side request forgery
    mode: join
    join:
      refs:
        - rule: go/lib/http-sources.yaml#http-sources
          as: src
        - rule: go/lib/ssrf-sinks.yaml#ssrf-sinks
          as: sink
      on:
        - 'src.$UNTRUSTED -> sink.$UNTRUSTED'

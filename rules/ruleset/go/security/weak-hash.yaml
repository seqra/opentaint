rules:
  - id: weak-hash-cwe-328
    languages: [go]
    severity: ERROR
    message: Use of a weak or broken cryptographic hash
    metadata:
      cwe: CWE-328
      short-description: Weak cryptographic hash
    mode: search
    patterns:
      - pattern-inside: |
          import "crypto/md5"
          import "crypto/sha1"
          import "golang.org/x/crypto/md4"
          ...
      - pattern-either:
          - pattern: "md5.New(...)"
          - pattern: "md5.Sum(...)"
          - pattern: "sha1.New(...)"
          - pattern: "sha1.Sum(...)"
          - pattern: "md4.New(...)"

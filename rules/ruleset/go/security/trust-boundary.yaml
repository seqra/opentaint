rules:
  - id: trust-boundary-cwe-501
    languages: [go]
    severity: ERROR
    message: Tainted user input stored across a trust boundary (cookie/header/session)
    metadata:
      cwe: CWE-501
      short-description: Trust boundary violation
    mode: taint
    pattern-sources:
      - label: "$UNTRUSTED"
        patterns:
          - pattern-inside: |
              import "net/http"
              import "os"
              import web "github.com/beego/beego/v2/server/web"
              import context "github.com/beego/beego/v2/server/web/context"
              ...
          - pattern-either:
              # net/http request methods
              - pattern: "($R : *http.Request).FormValue($K)"
              - pattern: "($R : *http.Request).PostFormValue($K)"
              - pattern: "($R : *http.Request).FormFile($K)"
              - pattern: "($R : *http.Request).Cookie($K)"
              - pattern: "($R : *http.Request).Cookies()"
              - pattern: "($R : *http.Request).MultipartReader()"
              - pattern: "($R : *http.Request).Referer()"
              - pattern: "($R : *http.Request).UserAgent()"
              # net/http request fields
              - pattern: "($R : *http.Request).URL.Query()"
              - pattern: "($R : *http.Request).URL.Query().Get($K)"
              - pattern: "($R : *http.Request).URL.Path"
              - pattern: "($R : *http.Request).URL.RawQuery"
              - pattern: "($R : *http.Request).URL.RawPath"
              - pattern: "($R : *http.Request).RequestURI"
              - pattern: "($R : *http.Request).Header.Get($K)"
              - pattern: "($R : *http.Request).Header[$K]"
              - pattern: "($R : *http.Request).Header[$K][$I]"
              - pattern: "($R : *http.Request).Form[$K]"
              - pattern: "($R : *http.Request).Form[$K][$I]"
              - pattern: "($R : *http.Request).PostForm[$K]"
              - pattern: "($R : *http.Request).PostForm[$K][$I]"
              - pattern: "($R : *http.Request).URL.Query()[$K]"
              - pattern: "($R : *http.Request).URL.Query()[$K][$I]"
              - pattern: "($R : *http.Request).Header.Values($K)"
              - pattern: "($R : *http.Request).Form.Get($K)"
              - pattern: "($R : *http.Request).PostForm.Get($K)"
              - pattern: "($R : *http.Request).Body"
              - pattern: "($R : *http.Request).GetBody"
              - pattern: "($R : *http.Request).Form"
              - pattern: "($R : *http.Request).PostForm"
              - pattern: "($R : *http.Request).MultipartForm"
              - pattern: "($R : *http.Request).Header"
              - pattern: "($R : *http.Request).Trailer"
              - pattern: "($R : *http.Request).URL"
              # process environment
              - pattern: "os.Getenv($K)"
              - pattern: "os.LookupEnv($K)"
              - pattern: "os.Args"
              # beego Controller methods
              - pattern: "($C : *web.Controller).GetString($K)"
              - pattern: "($C : *web.Controller).GetString($K, $DEF)"
              - pattern: "($C : *web.Controller).GetStrings($K)"
              - pattern: "($C : *web.Controller).GetStrings($K, $DEF)"
              - pattern: "($C : *web.Controller).GetInt($K)"
              - pattern: "($C : *web.Controller).GetInt($K, $DEF)"
              - pattern: "($C : *web.Controller).GetInt8($K)"
              - pattern: "($C : *web.Controller).GetInt16($K)"
              - pattern: "($C : *web.Controller).GetInt32($K)"
              - pattern: "($C : *web.Controller).GetInt64($K)"
              - pattern: "($C : *web.Controller).GetUint8($K)"
              - pattern: "($C : *web.Controller).GetUint16($K)"
              - pattern: "($C : *web.Controller).GetUint32($K)"
              - pattern: "($C : *web.Controller).GetUint64($K)"
              - pattern: "($C : *web.Controller).GetFloat($K)"
              - pattern: "($C : *web.Controller).GetBool($K)"
              - pattern: "($C : *web.Controller).GetFile($K)"
              - pattern: "($C : *web.Controller).GetFiles($K)"
              - pattern: "($C : *web.Controller).GetSession($K)"
              - pattern: "($C : *web.Controller).Input()"
              - pattern: "($C : *web.Controller).ParseForm($PTR)"
              # beego Context.Input methods (c.Ctx.Input.X)
              - pattern: "($X : *context.BeegoInput).Param($K)"
              - pattern: "($X : *context.BeegoInput).Header($K)"
              - pattern: "($X : *context.BeegoInput).Params()"
              - pattern: "($X : *context.BeegoInput).URI()"
              - pattern: "($X : *context.BeegoInput).URL()"
              - pattern: "($X : *context.BeegoInput).RequestBody"
              - pattern: "($X : *context.BeegoInput).Bind($PTR)"
    pattern-sinks:
      - patterns:
          - pattern-inside: |
              import "net/http"
              import web "github.com/beego/beego/v2/server/web"
              ...
          - pattern-either:
              - pattern: "http.SetCookie($W, $C)"
              - pattern: "($C : *web.Controller).SetSession($K, $V)"

rules:
  - id: go-path-traversal
    languages: [go]
    severity: ERROR
    message: Tainted user input reaches filesystem path (path traversal)
    metadata:
      cwe: CWE-22
      short-description: Path traversal
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $R.FormValue($K)
          - pattern: $R.PostFormValue($K)
          - pattern: $R.FormFile($K)
          - pattern: $R.Cookie($K)
          - pattern: $R.Cookies()
          - pattern: $R.MultipartReader()
          - pattern: $R.Referer()
          - pattern: $R.UserAgent()
          - pattern: $R.URL.Query()
          - pattern: $R.URL.Query().Get($K)
          - pattern: $R.URL.Path
          - pattern: $R.URL.RawQuery
          - pattern: $R.URL.RawPath
          - pattern: $R.Header.Get($K)
          - pattern: $R.Header.Values($K)
          - pattern: $R.Form.Get($K)
          - pattern: $R.PostForm.Get($K)
          - pattern: $R.Body
          - pattern: $R.GetBody
          - pattern: $R.Form
          - pattern: $R.PostForm
          - pattern: $R.MultipartForm
          - pattern: $R.Header
          - pattern: $R.Trailer
          - pattern: $R.URL
          - pattern: os.Getenv($K)
          - pattern: os.LookupEnv($K)
          - pattern: os.Args
          # beego Controller methods
          - pattern: $C.GetString($K)
          - pattern: $C.GetString($K, $DEF)
          - pattern: $C.GetStrings($K)
          - pattern: $C.GetStrings($K, $DEF)
          - pattern: $C.GetInt($K)
          - pattern: $C.GetInt($K, $DEF)
          - pattern: $C.GetInt8($K)
          - pattern: $C.GetInt16($K)
          - pattern: $C.GetInt32($K)
          - pattern: $C.GetInt64($K)
          - pattern: $C.GetUint8($K)
          - pattern: $C.GetUint16($K)
          - pattern: $C.GetUint32($K)
          - pattern: $C.GetUint64($K)
          - pattern: $C.GetFloat($K)
          - pattern: $C.GetBool($K)
          - pattern: $C.GetFile($K)
          - pattern: $C.GetFiles($K)
          - pattern: $C.GetSession($K)
          - pattern: $C.Input()
          - pattern: $C.ParseForm($PTR)
          # beego Context.Input methods (c.Ctx.Input.X)
          - pattern: $X.Param($K)
          - pattern: $X.Params()
          - pattern: $X.URI()
          - pattern: $X.URL()
          - pattern: $X.RequestBody
          - pattern: $X.Bind($PTR)
    pattern-sinks:
      - pattern-either:
          - pattern: os.Open($P)
          - pattern: os.OpenFile($P, ...)
          - pattern: os.Create($P)
          - pattern: os.CreateTemp($DIR, $PAT)
          - pattern: os.MkdirTemp($DIR, $PAT)
          - pattern: os.Mkdir($P, ...)
          - pattern: os.MkdirAll($P, ...)
          - pattern: os.Remove($P)
          - pattern: os.RemoveAll($P)
          - pattern: os.ReadFile($P)
          - pattern: os.WriteFile($P, ...)
          - pattern: os.ReadDir($P)
          - pattern: os.Stat($P)
          - pattern: os.Lstat($P)
          - pattern: os.Truncate($P, ...)
          - pattern: os.Chdir($P)
          - pattern: os.Chmod($P, ...)
          - pattern: os.Chown($P, ...)
          - pattern: os.Lchown($P, ...)
          - pattern: os.Chtimes($P, ...)
          - pattern: os.Readlink($P)
          - pattern: os.Rename($A, $B)
          - pattern: os.Link($A, $B)
          - pattern: os.Symlink($A, $B)
          - pattern: os.DirFS($P)
          - pattern: ioutil.ReadFile($P)
          - pattern: ioutil.WriteFile($P, ...)
          - pattern: ioutil.ReadDir($P)
          - pattern: ioutil.TempFile($DIR, $PAT)
          - pattern: ioutil.TempDir($DIR, $PAT)
          - pattern: http.ServeFile($W, $R, $P)

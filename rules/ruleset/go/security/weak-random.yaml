rules:
  - id: weak-random-cwe-330
    languages: [go]
    severity: ERROR
    message: Use of a weak (non-cryptographic) random number generator
    metadata:
      cwe: CWE-330
      short-description: Insecure randomness
    mode: search
    patterns:
      - pattern-either:
          - pattern-inside: |
              import "math/rand"
              ...
          - pattern-inside: |
              import rand "math/rand/v2"
              ...
      - pattern-either:
          - pattern: "rand.Int()"
          - pattern: "rand.Intn(...)"
          - pattern: "rand.Int31()"
          - pattern: "rand.Int31n(...)"
          - pattern: "rand.Int63()"
          - pattern: "rand.Int63n(...)"
          - pattern: "rand.IntN(...)"
          - pattern: "rand.Int32()"
          - pattern: "rand.Int32N(...)"
          - pattern: "rand.Int64()"
          - pattern: "rand.Int64N(...)"
          - pattern: "rand.Float64()"
          - pattern: "rand.Float32()"
          - pattern: "rand.NormFloat64()"
          - pattern: "rand.ExpFloat64()"
          - pattern: "rand.Uint32()"
          - pattern: "rand.Uint32N(...)"
          - pattern: "rand.Uint64()"
          - pattern: "rand.Uint64N(...)"
          - pattern: "rand.Perm(...)"
          - pattern: "rand.New(...)"
          - pattern: "rand.Shuffle(...)"
          - pattern: "rand.Read(...)"
          - pattern: "rand.Seed(...)"

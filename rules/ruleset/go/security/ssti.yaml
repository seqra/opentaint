rules:
  - id: ssti
    languages: [go]
    severity: ERROR
    message: Tainted user input parsed as a template source (server-side template injection)
    metadata:
      cwe: CWE-1336
      short-description: Server-side template injection
    mode: join
    join:
      refs:
        - rule: go/lib/http-sources.yaml#http-sources
          as: src
        - rule: go/lib/ssti-sinks.yaml#ssti-sinks
          as: sink
      on:
        - 'src.$UNTRUSTED -> sink.$UNTRUSTED'

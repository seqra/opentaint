rules:
  - id: weak-crypto-cwe-327
    languages: [go]
    severity: ERROR
    message: Use of a broken or risky cryptographic algorithm
    metadata:
      cwe: CWE-327
      short-description: Broken or risky crypto algorithm
    mode: search
    patterns:
      - pattern-inside: |
          import "crypto/des"
          import "crypto/rc4"
          import "golang.org/x/crypto/md4"
          import "github.com/andreburgaud/crypt2go/ecb"
          ...
      - pattern-either:
          - pattern: "des.NewCipher(...)"
          - pattern: "des.NewTripleDESCipher(...)"
          - pattern: "rc4.NewCipher(...)"
          - pattern: "md4.New(...)"
          - pattern: "ecb.NewECBEncrypter(...)"
          - pattern: "ecb.NewECBDecrypter(...)"

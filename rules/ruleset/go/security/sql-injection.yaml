rules:
  - id: sql-injection
    severity: ERROR
    message: >-
      SQL injection: a query is assembled from user-controlled input
    metadata:
      cwe: CWE-89
      short-description: SQL query built from user-controlled input
      full-description: |-
        SQL injection occurs when untrusted data is concatenated into a query string that
        is handed to `database/sql` execution APIs such as `Query`, `QueryRow`, `Exec`, or
        `Prepare`. An attacker who controls part of the query can read, modify, or destroy
        data, or bypass authentication.

        Vulnerable example:

        ```go
        func handler(w http.ResponseWriter, r *http.Request, db *sql.DB) {
            name := r.FormValue("name") // untrusted

            // VULNERABLE: user input is concatenated into the query text
            rows, _ := db.Query("SELECT id FROM users WHERE name = '" + name + "'")
            _ = rows
        }
        ```

        Safe example:

        ```go
        func handler(w http.ResponseWriter, r *http.Request, db *sql.DB) {
            name := r.FormValue("name")

            // SAFE: parameterized query; the driver binds the value, never the query text
            rows, _ := db.Query("SELECT id FROM users WHERE name = ?", name)
            _ = rows
        }
        ```

        Patterns covered include `*sql.DB`, `*sql.Tx`, and `*sql.Conn` query/exec/prepare
        methods (`Query`, `QueryContext`, `QueryRow`, `Exec`, `Prepare`, ...) reached by a
        tainted query-string argument.
      references:
        - https://owasp.org/www-community/attacks/SQL_Injection
        - https://cwe.mitre.org/data/definitions/89.html
      provenance: https://github.com/seqra/opentaint/tree/main/skills
    languages:
      - go
    mode: join
    join:
      refs:
        - rule: go/lib/http-sources.yaml#http-sources
          as: src
        - rule: go/lib/http-sources-requesturi.yaml#http-sources-requesturi
          as: extra_requesturi
        - rule: go/lib/http-sources-header-index.yaml#http-sources-header-index
          as: extra_header
        - rule: go/lib/sql-sinks.yaml#sql-sinks
          as: sink
      on:
        - 'src.$UNTRUSTED -> sink.$UNTRUSTED'
        - 'extra_requesturi.$UNTRUSTED -> sink.$UNTRUSTED'
        - 'extra_header.$UNTRUSTED -> sink.$UNTRUSTED'

rules:
  - id: phase3-coverage-strings
    languages:
      - java
    severity: ERROR
    message: taint reaches sink through a String or java.text passthrough
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: $X = osrc();
          - focus-metavariable: $X
      - patterns:
          - pattern: $X = bsrc();
          - focus-metavariable: $X
      - patterns:
          - pattern: $X = ssrc();
          - focus-metavariable: $X
    pattern-sinks:
      - patterns:
          - pattern: strSink($Y);
          - focus-metavariable: $Y

rules:
  - id: phase3-coverage-bean-isolation
    languages:
      - java
    severity: ERROR
    message: taint reaches sink through a bean property that should be isolated from an unrelated sibling property
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: $X = ssrc();
          - focus-metavariable: $X
    pattern-sinks:
      - patterns:
          - pattern: strSink($Y);
          - focus-metavariable: $Y
      - patterns:
          - pattern: objSink($Y);
          - focus-metavariable: $Y

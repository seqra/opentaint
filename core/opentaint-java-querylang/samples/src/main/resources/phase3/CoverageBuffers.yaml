rules:
  - id: phase3-coverage-buffers
    languages:
      - java
    severity: ERROR
    message: taint reaches sink through a java.nio buffer passthrough
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: $X = bsrc();
          - focus-metavariable: $X
      - patterns:
          - pattern: $X = ssrc();
          - focus-metavariable: $X
    pattern-sinks:
      - patterns:
          - pattern: strSink($Y);
          - focus-metavariable: $Y
      - patterns:
          - pattern: bytesSink($Y);
          - focus-metavariable: $Y

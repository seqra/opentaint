rules:
  - id: phase3-coverage-naming-ldap
    languages:
      - java
    severity: ERROR
    message: taint reaches sink through a javax.naming.ldap passthrough
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: $X = asrc();
          - focus-metavariable: $X
      - patterns:
          - pattern: $X = bsrc();
          - focus-metavariable: $X
    pattern-sinks:
      - patterns:
          - pattern: ctrlSink($*Y);
          - focus-metavariable: $Y

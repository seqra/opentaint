rules:
  - id: taint-StarInterproc
    languages:
      - java
    severity: ERROR
    message: match taint/StarInterproc
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: $*X = src();
          - focus-metavariable: $X
    pattern-sinks:
      - patterns:
          - pattern: sink($Y);
          - focus-metavariable: $Y

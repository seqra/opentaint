rules:
  - id: taint-StarMixedExclusionSanitizer
    languages:
      - java
    severity: ERROR
    message: match taint/StarMixedExclusionSanitizer
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: $*X = src();
          - focus-metavariable: $X
    pattern-sanitizers:
      - patterns:
          - pattern: cleanAll($*C);
          - focus-metavariable: $C
      - patterns:
          - pattern: cleanValue($V);
          - focus-metavariable: $V
    pattern-sinks:
      - patterns:
          - pattern: sink($Y);
          - focus-metavariable: $Y

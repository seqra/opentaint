rules:
  - id: taint-StarDeepSanitizer
    languages:
      - java
    severity: ERROR
    message: match taint/StarDeepSanitizer
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: $X = src();
          - focus-metavariable: $X
    pattern-sanitizers:
      - patterns:
          - pattern: clean($*C);
          - focus-metavariable: $C
    pattern-sinks:
      - patterns:
          - pattern: sink($Y);
          - focus-metavariable: $Y

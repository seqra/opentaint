rules:
  - id: taint-StarSink
    languages:
      - java
    severity: ERROR
    message: match taint/StarSink
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: $X = src();
          - focus-metavariable: $X
    pattern-sinks:
      - patterns:
          - pattern: sink($*Y);
          - focus-metavariable: $Y

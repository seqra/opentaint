rules:
  - id: type-based-sink
    languages: [go]
    severity: WARNING
    message: "Taint reaches util.Exec on a util.Cmd argument"
    mode: taint
    pattern-sources:
      - pattern: "util.Source(...)"
    pattern-sinks:
      - patterns:
          - pattern: "util.Exec($X)"
          - metavariable-type:
              metavariable: "$X"
              type: "util.Cmd"

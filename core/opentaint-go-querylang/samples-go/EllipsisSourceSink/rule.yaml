rules:
  - id: ellipsis-source-sink
    languages: [go]
    severity: WARNING
    message: "Taint from util.Source reaches util.Sink after intervening statements"
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: "$X = util.Source(...)"
          - focus-metavariable: "$X"
    pattern-sinks:
      - pattern: "util.Sink($X)"

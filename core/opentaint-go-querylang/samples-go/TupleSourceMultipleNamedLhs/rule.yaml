rules:
  - id: tuple-source-multiple-named-lhs
    languages: [go]
    severity: WARNING
    message: Tainted tuple slot reaches the sink
    mode: taint
    pattern-sources:
      - label: "$SOURCE"
        patterns:
          - pattern: "$VALUE, $ERR := TupleSourceMultipleNamedLhs.SourceTuple()"
          - focus-metavariable: $VALUE
    pattern-sinks:
      - pattern: "TupleSourceMultipleNamedLhs.Sink($SINK)"

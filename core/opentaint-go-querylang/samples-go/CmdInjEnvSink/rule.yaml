rules:
  - id: go-command-injection-env-sink
    languages: [go]
    severity: ERROR
    message: Tainted user input reaches OS command execution via Cmd receiver (command injection)
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: os.Getenv($K)
    pattern-sinks:
      - pattern-either:
          - patterns:
              - pattern: $*C.CombinedOutput()
              - focus-metavariable: $C
          - patterns:
              - pattern: $*C.Run()
              - focus-metavariable: $C
          - patterns:
              - pattern: $*C.Output()
              - focus-metavariable: $C
          - patterns:
              - pattern: $*C.Start()
              - focus-metavariable: $C

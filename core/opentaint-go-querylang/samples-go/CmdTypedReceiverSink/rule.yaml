rules:
  - id: cmd-typed-receiver-sink
    languages: [go]
    severity: ERROR
    message: Tainted user input reaches OS command execution via an *exec.Cmd receiver
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: os.Getenv($K)
    pattern-sinks:
      - pattern-either:
          - patterns:
              - pattern: "($C* : *exec.Cmd).Run()"
              - focus-metavariable: $C
          - patterns:
              - pattern: "($C* : *exec.Cmd).CombinedOutput()"
              - focus-metavariable: $C

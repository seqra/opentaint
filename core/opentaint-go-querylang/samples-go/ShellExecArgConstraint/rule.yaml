rules:
  - id: shell-exec-arg-constraint
    languages: [go]
    severity: WARNING
    message: "Tainted command reaches a shell exec"
    mode: taint
    pattern-sources:
      - pattern: "ShellExecArgConstraint.Source(...)"
    pattern-sinks:
      - patterns:
          - pattern: 'exec.Command("$NAME", ...)'
          - metavariable-regex:
              metavariable: $NAME
              regex: ^(.*/)?(sh|bash|zsh|dash)$

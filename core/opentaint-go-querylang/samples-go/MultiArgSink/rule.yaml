rules:
  - id: multi-arg-sink
    languages: [go]
    severity: WARNING
    message: "Taint from util.Source reaches arg 1 of util.Exec"
    mode: taint
    pattern-sources:
      - pattern: "util.Source(...)"
    pattern-sinks:
      - patterns:
          - pattern: "util.Exec($CMD, $ARG)"
          - focus-metavariable: "$ARG"

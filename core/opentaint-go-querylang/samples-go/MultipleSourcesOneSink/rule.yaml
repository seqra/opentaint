rules:
  - id: multiple-sources-one-sink
    languages: [go]
    severity: WARNING
    message: "Taint from either util.Source or util.Other reaches util.Sink"
    mode: taint
    pattern-sources:
      - pattern: "util.Source(...)"
      - pattern: "util.Other(...)"
    pattern-sinks:
      - pattern: "util.Sink($X)"

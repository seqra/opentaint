rules:
  - id: sanitizer
    languages: [go]
    severity: WARNING
    message: "Taint from util.Source reaches util.Sink without going through util.Clean"
    mode: taint
    pattern-sources:
      - pattern: "util.Source(...)"
    pattern-sanitizers:
      - pattern: "util.Clean($X)"
    pattern-sinks:
      - pattern: "util.Sink($X)"

rules:
  - id: loginj-04-postform-logprint
    languages: [go]
    severity: WARNING
    message: Tainted PostFormValue reaches log.Print via Sprintf (log injection)
    mode: taint
    pattern-sources:
      - pattern: $R.PostFormValue($K)
    pattern-sinks:
      - patterns:
          - pattern: log.Print($*X)
          - focus-metavariable: $X

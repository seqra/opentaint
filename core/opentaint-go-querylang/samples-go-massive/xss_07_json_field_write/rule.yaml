rules:
  - id: xss-07-json-field-write
    languages: [go]
    severity: WARNING
    message: Tainted form-derived JSON field reaches w.Write (stored XSS pattern)
    mode: taint
    pattern-sources:
      - pattern: $R.FormValue($K)
    pattern-sinks:
      - patterns:
          - pattern: $W.Write($B*)
          - focus-metavariable: $B

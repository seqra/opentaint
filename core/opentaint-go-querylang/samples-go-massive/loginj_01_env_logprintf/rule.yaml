rules:
  - id: loginj-01-env-logprintf
    languages: [go]
    severity: WARNING
    message: Tainted env reaches log.Printf (log injection)
    mode: taint
    pattern-sources:
      - pattern: os.Getenv("USER_NAME")
    pattern-sinks:
      - patterns:
          - pattern: log.Printf($FMT, $*X)
          - focus-metavariable: $X

rules:
  - id: example-rulewithallowedconstant
    languages: [python]
    severity: ERROR
    message: match example/RuleWithAllowedConstant (Python port)
    mode: taint
    pattern-sources:
      - pattern: source()
    pattern-sinks:
      - patterns:
          - pattern: sink($X)
          - pattern-not: sink("...")

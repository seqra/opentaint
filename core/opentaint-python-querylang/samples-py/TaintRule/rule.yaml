rules:
  - id: taint-rule
    languages: [python]
    severity: ERROR
    message: match taint/Rule (Python port)
    mode: taint
    pattern-sources:
      - patterns:
          - focus-metavariable: $X
          - pattern: $X = src()
    pattern-sinks:
      - patterns:
          - pattern: sink($Y)
          - focus-metavariable: $Y

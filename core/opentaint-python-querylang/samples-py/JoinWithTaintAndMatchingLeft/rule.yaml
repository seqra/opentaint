rules:
  - id: join-with-taint-and-matching-left
    severity: ERROR
    message: Join rule with taint and matching left rules (Python port)
    languages: [python]
    mode: join
    join:
      refs:
        - rule: matching-init-rule
          as: matching-init-rule
        - rule: taint-flow-rule
          as: taint-flow-rule
        - rule: common-sink-rule
          as: common-sink-rule
      rules:
        - id: matching-init-rule
          message: Initialization pattern matched
          severity: NOTE
          languages: [python]
          patterns:
            - pattern: $DATA = create_initial_data()

        - id: taint-flow-rule
          message: Taint flow detected
          severity: NOTE
          languages: [python]
          mode: taint
          pattern-sources:
            - patterns:
                - pattern: get_untrusted_input()
              label: UNTRUSTED
            - patterns:
                - pattern: process_input($X)
              requires: UNTRUSTED
              label: PROCESSED
            - patterns:
                - pattern: $TAINTED = transform_data($Y)
                - focus-metavariable: $TAINTED
              label: $TAINTED
              requires: PROCESSED

        - id: common-sink-rule
          message: Common sink matched
          severity: NOTE
          languages: [python]
          patterns:
            - pattern: execute_dangerous($TARGET)

      on:
        - 'matching-init-rule.$DATA -> common-sink-rule.$TARGET'
        - 'taint-flow-rule.$TAINTED -> common-sink-rule.$TARGET'

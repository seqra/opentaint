rules:
  - id: taint-rule-with-pass
    languages: [python]
    severity: ERROR
    message: match taint/RuleWithPass (Python port)
    mode: taint
    pattern-sources:
      - patterns:
          - focus-metavariable: $X
          - pattern: $X = src()
    pattern-sinks:
      - patterns:
          - pattern: sink($Y)
          - focus-metavariable: $Y
    pattern-propagators:
      - from: $F
        to: $T
        patterns:
          - pattern: $T = pass_through($F)

rules:
  - id: example-arrayexample
    languages: [python]
    severity: ERROR
    message: match example/ArrayExample (Python port)
    patterns:
      - pattern-either:
          - patterns:
              - pattern: array_sink($PARAM)
              - pattern-inside: |
                  def $METHOD($PARAM: List[str]) -> $RET:
                      ...
          - patterns:
              - pattern: other_element_sink($PARAM)
              - pattern-inside: |
                  def $METHOD($PARAM: List[str]) -> $RET:
                      ...
          - pattern: |
              $PARAM = source(...)
              ...
              array_sink($PARAM)
          - pattern: |
              $PARAM = source(...)
              ...
              other_element_sink($PARAM)

rules:
  - id: complex-source-sink
    languages: [python]
    severity: ERROR
    message: match complex source/sink (Python port of taint/RuleComplexSourceSink)
    mode: taint
    pattern-sources:
      - patterns:
          - focus-metavariable: $X
          - pattern: |
              $A = src_init()
              $X = src($A)
    pattern-sinks:
      - patterns:
          - pattern: |
              $B = sink_init()
              sink($B, $Y)
          - focus-metavariable: $Y

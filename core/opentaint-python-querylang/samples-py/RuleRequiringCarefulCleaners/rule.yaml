rules:
  - id: example-rulerequiringcarefulcleaners
    languages: [python]
    severity: ERROR
    message: match example/RuleRequiringCarefulCleaners (Python port)
    patterns:
      - pattern: |-
          $A = src()
          $B = $A.get_obj_good()
          sink($B)
      - pattern-not: |-
          $A = src()
          $B = $A.get_obj_bad()
          sink($B)

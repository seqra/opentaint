rules:
  - id: owasp-pathtraver-00092
    languages: [python]
    severity: ERROR
    message: "Tainted request data reaches a file-access path (path traversal / CWE-22)"
    metadata:
      cwe: CWE-22
    patterns:
      - pattern: |
          $A = flask.request.form.get(...)
          ...
          $A.read_text(...)

rules:
  - id: owasp-ldapi-01169
    languages: [python]
    severity: ERROR
    message: "Tainted request data reaches an LDAP search filter (LDAP injection)"
    metadata:
      cwe: CWE-90
    patterns:
      - pattern: |
          $FILTER = flask.request
          ...
          $CONN.search($BASE, $FILTER, ...)

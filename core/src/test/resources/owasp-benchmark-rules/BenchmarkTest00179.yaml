rules:
  - id: owasp-pathtraver-00179
    languages: [python]
    severity: ERROR
    message: "Tainted request data reaches a file-access path (path traversal / CWE-22)"
    metadata:
      cwe: CWE-22
    patterns:
      - pattern: |
          $A = flask.request.form.getlist(...)[...]
          ...
          os.path.exists($A)

rules:
  - id: owasp-ldapi-00823
    languages: [python]
    mode: taint
    message: "Tainted request data reaches an LDAP search filter (LDAP injection)"
    severity: ERROR
    metadata:
      cwe: CWE-90
    pattern-sources:
      - pattern-either:
          - pattern: "flask.request.args.getlist(...)"
          - pattern: "flask.request.args.getlist(...)[...]"
    pattern-sinks:
      - patterns:
          - pattern: "$CONN.search($BASE, $FILTER, ...)"
          - focus-metavariable: $FILTER

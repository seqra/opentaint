rules:
  - id: owasp-xxe-00930
    languages: [python]
    severity: ERROR
    message: "Tainted request data reaches an external-entity-enabled XML parse (XXE)"
    metadata:
      cwe: CWE-611
    patterns:
      - pattern: |
          $DOC = flask.request.query_string
          ...
          $P.setFeature($F, True)
          ...
          xml.dom.minidom.parseString($DOC, $P)

rules:
  - id: owasp-xpathi-00466
    languages: [python]
    severity: ERROR
    message: "Tainted request data reaches an XPath query (XPath injection / CWE-643)"
    metadata:
      cwe: CWE-643
    patterns:
      - pattern: |
          $A = flask.request.headers.get(...)
          ...
          lxml.etree.XPath($A)

rules:
  - id: owasp-redirect-00067
    languages: [python]
    severity: ERROR
    message: "Tainted request data reaches flask.redirect (open redirect / CWE-601)"
    metadata:
      cwe: CWE-601
    patterns:
      - pattern: |
          $A = flask.request.cookies.get(...)
          ...
          flask.redirect($URL)

rules:
  - id: owasp-xxe-00759
    languages: [python]
    mode: taint
    message: "Tainted request data reaches an external-entity-enabled XML parse (XXE)"
    severity: ERROR
    metadata:
      cwe: CWE-611
    pattern-sources:
      - pattern-either:
          - pattern: "flask.request.args.getlist(...)"
          - pattern: "flask.request.args.getlist(...)[...]"
    pattern-sinks:
      - patterns:
          - pattern-inside: |
              $P.setFeature($F, True)
              ...
          - pattern: "xml.dom.minidom.parseString($DOC, $P)"
          - focus-metavariable: $DOC

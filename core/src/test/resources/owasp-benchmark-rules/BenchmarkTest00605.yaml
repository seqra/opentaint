rules:
  - id: owasp-deserialization-00605
    languages: [python]
    severity: ERROR
    message: "Tainted request data reaches pickle.loads (unsafe deserialization / CWE-502)"
    metadata:
      cwe: CWE-502
    patterns:
      - pattern: |
          $A = flask.request.headers.getlist(...)[...]
          ...
          pickle.loads($A)

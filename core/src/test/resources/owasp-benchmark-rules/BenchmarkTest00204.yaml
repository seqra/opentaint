rules:
  - id: owasp-xxe-00204
    languages: [python]
    severity: ERROR
    message: "Tainted request data reaches an external-entity-enabled XML parse (XXE)"
    metadata:
      cwe: CWE-611
    patterns:
      - pattern-either:
          - pattern: |
              $DOC = flask.request.form.getlist(...)
              ...
              $P.setFeature($F, True)
              ...
              xml.dom.minidom.parseString($DOC, $P)
          - pattern: |
              $DOC = flask.request.form.getlist(...)[...]
              ...
              $P.setFeature($F, True)
              ...
              xml.dom.minidom.parseString($DOC, $P)

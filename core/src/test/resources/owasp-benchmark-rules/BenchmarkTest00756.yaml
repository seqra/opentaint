rules:
  - id: owasp-xpathi-00756
    languages: [python]
    severity: ERROR
    message: "Tainted request data reaches an XPath query (XPath injection / CWE-643)"
    metadata:
      cwe: CWE-643
    patterns:
      - pattern: |
          $A = flask.request.args.getlist(...)[...]
          ...
          elementpath.select($ROOT, $A)

rules:
  - id: owasp-xss-00279
    languages: [python]
    severity: ERROR
    message: "Tainted request data reaches the returned response body (XSS / CWE-79)"
    metadata:
      cwe: CWE-79
    patterns:
      - pattern: |
          $REQ = flask.request
          ...
          $A = $REQ.form.get(...)
          ...
          return $A

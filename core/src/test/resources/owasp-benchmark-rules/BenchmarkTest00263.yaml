rules:
  - id: owasp-codeinj-00263
    languages: [python]
    severity: ERROR
    message: "Tainted request data reaches eval/exec (code injection / CWE-94)"
    metadata:
      cwe: CWE-94
    patterns:
      - pattern: |
          $A = flask.request.form.getlist(...)[...]
          ...
          eval($A)

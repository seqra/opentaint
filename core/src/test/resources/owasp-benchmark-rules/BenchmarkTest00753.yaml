rules:
  - id: owasp-xss-00753
    languages: [python]
    severity: ERROR
    message: "Tainted request data reaches the returned response body (XSS / CWE-79)"
    metadata:
      cwe: CWE-79
    patterns:
      - pattern: |
          $A = flask.request.args.getlist(...)[...]
          ...
          return $A

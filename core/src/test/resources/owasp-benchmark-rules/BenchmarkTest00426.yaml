rules:
  - id: owasp-codeinj-00426
    languages: [python]
    severity: ERROR
    message: "Tainted request data reaches eval/exec (code injection / CWE-94)"
    metadata:
      cwe: CWE-94
    patterns:
      - pattern: |
          $M = flask.request.form.keys(...)[...]
          ...
          exec($M)
      - pattern-not: |
          ...
          $M.startswith(...)
          ...
          exec($M)

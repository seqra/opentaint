rules:
  - id: owasp-ldapi-01170
    languages: [python]
    mode: taint
    message: "Tainted request data reaches an LDAP search filter (LDAP injection)"
    severity: ERROR
    metadata:
      cwe: CWE-90
    pattern-sources:
      - pattern: "flask.request"
    pattern-sinks:
      - patterns:
          - pattern: "$CONN.search($BASE, $FILTER, ...)"
          - focus-metavariable: $FILTER

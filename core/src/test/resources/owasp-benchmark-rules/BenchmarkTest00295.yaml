rules:
  - id: owasp-xpathi-00295
    languages: [python]
    severity: ERROR
    message: "Tainted request data reaches an XPath query (XPath injection / CWE-643)"
    metadata:
      cwe: CWE-643
    patterns:
      - pattern: |
          $A = flask.request.form.get(...)
          ...
          lxml.etree.XPath($A)

rules:
  - id: owasp-ldapi-00990
    languages: [python]
    severity: ERROR
    message: "Tainted request data reaches an LDAP search filter (LDAP injection)"
    metadata:
      cwe: CWE-90
    patterns:
      - pattern: |
          $FILTER = flask.request.query_string
          ...
          $CONN.search($BASE, $FILTER, ...)

rules:
  - id: owasp-redirect-00598
    languages: [python]
    severity: ERROR
    message: "Tainted request data reaches flask.redirect (open redirect / CWE-601)"
    metadata:
      cwe: CWE-601
    patterns:
      - pattern: |
          $M = flask.request.headers.getlist(...)
          ...
          flask.redirect($M)

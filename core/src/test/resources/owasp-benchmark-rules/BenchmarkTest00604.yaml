rules:
  - id: owasp-ldapi-00604
    languages: [python]
    severity: ERROR
    message: "Tainted request data reaches an LDAP search filter (LDAP injection)"
    metadata:
      cwe: CWE-90
    patterns:
      - pattern-either:
          - pattern: |
              $FILTER = flask.request.headers.getlist(...)
              ...
              $CONN.search($BASE, $FILTER, ...)
          - pattern: |
              $FILTER = flask.request.headers.getlist(...)[...]
              ...
              $CONN.search($BASE, $FILTER, ...)

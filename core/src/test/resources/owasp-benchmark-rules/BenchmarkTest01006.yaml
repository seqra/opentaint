rules:
  - id: owasp-pathtraver-01006
    languages: [python]
    severity: ERROR
    message: "Tainted request data reaches a file-access path (path traversal / CWE-22)"
    metadata:
      cwe: CWE-22
    patterns:
      - pattern: |
          $A = flask.request.query_string
          ...
          open($A, ...)

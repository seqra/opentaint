rules:
  - id: owasp-deserialization-00901
    languages: [python]
    severity: ERROR
    message: "Tainted request data reaches yaml.load (unsafe deserialization / CWE-502)"
    metadata:
      cwe: CWE-502
    patterns:
      - pattern: |
          $A = flask.request.args.get(...)
          ...
          yaml.load($A, ...)

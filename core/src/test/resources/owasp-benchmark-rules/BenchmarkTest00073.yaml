rules:
  - id: owasp-codeinj-00073
    languages: [python]
    severity: ERROR
    message: "Tainted request data reaches eval/exec (code injection / CWE-94)"
    metadata:
      cwe: CWE-94
    patterns:
      - pattern: |
          $M = flask.request.cookies.get(...)
          ...
          eval($M)

rules:
  - id: owasp-xss-00414
    languages: [python]
    severity: ERROR
    message: "Tainted request data reaches the returned response body (XSS / CWE-79)"
    metadata:
      cwe: CWE-79
    patterns:
      - pattern: |
          $A = flask.request.form.keys(...)[...]
          ...
          return $A
      - pattern-not: |
          ...
          html.escape($A)
          ...
          return $A

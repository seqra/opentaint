rules:
  - id: owasp-sqli-00192
    languages: [python]
    severity: ERROR
    message: "Tainted request data reaches a SQL execute (SQL injection)"
    metadata:
      cwe: CWE-89
    patterns:
      - pattern: |
          $Q = flask.request.form.getlist(...)
          ...
          $DB.execute($Q, ...)

rules:
  - id: owasp-redirect-00982
    languages: [python]
    severity: ERROR
    message: "Tainted request data reaches flask.redirect (open redirect / CWE-601)"
    metadata:
      cwe: CWE-601
    patterns:
      - pattern: |
          $A = flask.request.query_string.decode(...)
          ...
          flask.redirect($A)

rules:
  - id: owasp-ldapi
    languages: [python]
    severity: ERROR
    message: "Tainted request data reaches an LDAP filter (LDAP injection / CWE-90)"
    metadata:
      cwe: CWE-90
    patterns:
      - pattern: |
          $REQ = flask.request
          ...
      - pattern: |
          ...
          $B.search($C, $A, ...)
      - pattern-either:
          - pattern: |
              ...
              $A = $REQ.cookies.get(...)
              ...
          - pattern: |
              ...
              $A = $REQ.form.get(...)
              ...
          - pattern: |
              ...
              $A = $REQ.form.getlist(...)
              ...
          - pattern: |
              ...
              $A = $REQ.form.getlist(...)[...]
              ...
          - pattern: |
              ...
              $A = $REQ.form.keys(...)[...]
              ...
          - pattern: |
              ...
              $A = $REQ.headers.get(...)
              ...
          - pattern: |
              ...
              $A = $REQ.headers.getlist(...)
              ...
          - pattern: |
              ...
              $A = $REQ.headers.getlist(...)[...]
              ...
          - pattern: |
              ...
              $A = $REQ.args.get(...)
              ...
          - pattern: |
              ...
              $A = $REQ.args.getlist(...)
              ...
          - pattern: |
              ...
              $A = $REQ.args.getlist(...)[...]
              ...
          - pattern: |
              ...
              $A = $REQ.query_string
              ...

rules:
  - id: owasp-sqli
    languages: [python]
    severity: ERROR
    message: "Tainted request data reaches a SQL query (SQL injection / CWE-89)"
    metadata:
      cwe: CWE-89
    patterns:
      - pattern: |
          $REQ = flask.request
          ...
      - pattern: |
          ...
          $B.execute($A, ...)
      - pattern-either:
          - pattern: |
              ...
              $A = $REQ.cookies.get(...)
              ...
          - pattern: |
              ...
              $A = $REQ.form.get(...)
              ...
          - pattern: |
              ...
              $A = $REQ.form.getlist(...)
              ...
          - pattern: |
              ...
              $A = $REQ.headers.get(...)
              ...
          - pattern: |
              ...
              $A = $REQ.args.get(...)
              ...
          - pattern: |
              ...
              $A = $REQ.args.getlist(...)
              ...

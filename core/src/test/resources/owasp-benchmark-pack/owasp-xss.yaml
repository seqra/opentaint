rules:
  - id: owasp-xss
    languages: [python]
    severity: ERROR
    message: "Tainted request data reaches the returned response body (XSS / CWE-79)"
    metadata:
      cwe: CWE-79
    patterns:
      - pattern: |
          $REQ = flask.request
          ...
      - pattern: |
          ...
          return $A
      - pattern-either:
          - pattern: |
              ...
              $A = $REQ.cookies.get(...)
              ...
          - pattern: |
              ...
              $A = $REQ.form.get(...)
              ...
          - pattern: |
              ...
              $A = $REQ.form.getlist(...)[...]
              ...
          - pattern: |
              ...
              $A = $REQ.form.keys(...)[...]
              ...
          - pattern: |
              ...
              $A = $REQ.headers.get(...)
              ...
          - pattern: |
              ...
              $A = $REQ.headers.getlist(...)[...]
              ...
          - pattern: |
              ...
              $A = $REQ.args.get(...)
              ...
          - pattern: |
              ...
              $A = $REQ.args.getlist(...)[...]
              ...
          - pattern: |
              ...
              $A = $REQ.query_string
              ...
      - pattern-not: |
          ...
          html.escape($A)
          ...
      - pattern-not: |
          ...
          markupsafe.escape($A)
          ...

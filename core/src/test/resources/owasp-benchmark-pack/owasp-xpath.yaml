rules:
  - id: owasp-xpath
    languages: [python]
    severity: ERROR
    message: "Tainted request data reaches an XPath query (XPath injection / CWE-643)"
    metadata:
      cwe: CWE-643
    patterns:
      - pattern: |
          $REQ = flask.request
          ...
      - pattern-either:
          - pattern: |
              ...
              $B.xpath($A)
          - pattern: |
              ...
              elementpath.select($B, $A)
          - pattern: |
              ...
              lxml.etree.XPath($A)
      - pattern-either:
          - pattern: |
              ...
              $A = $REQ.cookies.get(...)
              ...
          - pattern: |
              ...
              $A = $REQ.form.get(...)
              ...
          - pattern: |
              ...
              $A = $REQ.form.getlist(...)[...]
              ...
          - pattern: |
              ...
              $A = $REQ.form.keys(...)[...]
              ...
          - pattern: |
              ...
              $A = $REQ.headers.get(...)
              ...
          - pattern: |
              ...
              $A = $REQ.headers.getlist(...)[...]
              ...
          - pattern: |
              ...
              $A = $REQ.args.get(...)
              ...
          - pattern: |
              ...
              $A = $REQ.args.getlist(...)[...]
              ...
          - pattern: |
              ...
              $A = $REQ.query_string
              ...

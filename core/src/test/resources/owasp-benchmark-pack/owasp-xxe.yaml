rules:
  - id: owasp-xxe
    languages: [python]
    severity: ERROR
    message: "Tainted XML with external entities enabled is parsed (XXE / CWE-611)"
    metadata:
      cwe: CWE-611
    patterns:
      - pattern: |
          $REQ = flask.request
          ...

      - pattern: |
          ...
          $B.setFeature($C, True)
          ...
          xml.dom.minidom.parseString($A, $B)

      - pattern-either:
          - pattern: |
              ...
              $A = $REQ.cookies.get(...)
              ...
          - pattern: |
              ...
              $A = $REQ.form.get(...)
              ...
          - pattern: |
              ...
              $A = $REQ.form.getlist(...)
              ...
          - pattern: |
              ...
              $A = $REQ.form.getlist(...)[...]
              ...
          - pattern: |
              ...
              $A = $REQ.headers.get(...)
              ...
          - pattern: |
              ...
              $A = $REQ.headers.getlist(...)
              ...
          - pattern: |
              ...
              $A = $REQ.headers.getlist(...)[...]
              ...
          - pattern: |
              ...
              $A = $REQ.args.get(...)
              ...
          - pattern: |
              ...
              $A = $REQ.args.getlist(...)
              ...
          - pattern: |
              ...
              $A = $REQ.args.getlist(...)[...]
              ...
          - pattern: |
              ...
              $A = $REQ.query_string
              ...
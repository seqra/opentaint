rules:
  - id: owasp-weakrand
    languages: [python]
    severity: ERROR
    message: "Insecure randomness used for a security-sensitive value (CWE-330)"
    metadata:
      cwe: CWE-330
    patterns:
      - pattern-either:
          - pattern: |
              random.normalvariate(...)
          - pattern: |
              random.randint(...)
          - pattern: |
              random.getrandbits(...)
          - pattern: |
              random.random(...)
          - pattern: |
              random.randbytes(...)

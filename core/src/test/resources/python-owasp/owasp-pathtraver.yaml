rules:
  - id: owasp-pathtraver
    languages: [python]
    severity: ERROR
    message: "Tainted request data reaches a file-access path (path traversal / CWE-22)"
    metadata:
      cwe: CWE-22
    patterns:
      - pattern: |
          $REQ = flask.request
          ...
      - pattern-either:
          - pattern: |
              ...
              open($A, ...)
          - pattern: |
              ...
              codecs.open($A, ...)
          - pattern: |
              ...
              os.path.exists($A)
          - pattern: |
              ...
              $A.exists(...)
          - pattern: |
              ...
              $A.read_text(...)
      - pattern-either:
          - pattern: |
              ...
              $A = $REQ.cookies.get(...)
              ...
          - pattern: |
              ...
              $A = $REQ.form.get(...)
              ...
          - pattern: |
              ...
              $A = $REQ.form.getlist(...)[...]
              ...
          - pattern: |
              ...
              $A = $REQ.form.keys(...)[...]
              ...
          - pattern: |
              ...
              $A = $REQ.headers.get(...)
              ...
          - pattern: |
              ...
              $A = $REQ.headers.getlist(...)[...]
              ...
          - pattern: |
              ...
              $A = $REQ.headers.keys(...)[...]
              ...
          - pattern: |
              ...
              $A = $REQ.args.get(...)
              ...
          - pattern: |
              ...
              $A = $REQ.args.getlist(...)[...]
              ...
          - pattern: |
              ...
              $A = $REQ.query_string
              ...

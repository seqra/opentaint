rules:
  - id: owasp-trustbound
    languages: [python]
    severity: ERROR
    message: "Tainted request data crosses a trust boundary into a session (CWE-501)"
    metadata:
      cwe: CWE-501
    patterns:
      - pattern: |
          $REQ = flask.request
          ...
      - pattern-either:
          - pattern: |
              ...
              flask.session[$B] = $A
          - pattern: |
              ...
              flask.session[$A] = $B
      - pattern-either:
          - pattern: |
              ...
              $A = $REQ.cookies.get(...)
              ...
          - pattern: |
              ...
              $A = $REQ.form.get(...)
              ...
          - pattern: |
              ...
              $A = $REQ.form.getlist(...)
              ...
          - pattern: |
              ...
              $A = $REQ.form.getlist(...)[...]
              ...
          - pattern: |
              ...
              $A = $REQ.headers.get(...)
              ...
          - pattern: |
              ...
              $A = $REQ.args.get(...)
              ...
          - pattern: |
              ...
              $A = $REQ.args.getlist(...)[...]
              ...
          - pattern: |
              ...
              $A = $REQ.query_string.decode(...)
              ...

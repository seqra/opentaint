rules:
  - id: owasp-deser
    languages: [python]
    severity: ERROR
    message: "Tainted request data reaches an unsafe deserializer (CWE-502)"
    metadata:
      cwe: CWE-502
    patterns:
      - pattern: |
          $REQ = flask.request
          ...
      - pattern-either:
          - pattern: |
              ...
              pickle.loads($A)
          - pattern: |
              ...
              yaml.load($A, ...)
      - pattern-either:
          - pattern: |
              ...
              $A = $REQ.cookies.get(...)
              ...
          - pattern: |
              ...
              $A = $REQ.form.get(...)
              ...
          - pattern: |
              ...
              $A = $REQ.form.getlist(...)[...]
              ...
          - pattern: |
              ...
              $A = $REQ.form.keys(...)[...]
              ...
          - pattern: |
              ...
              $A = $REQ.headers.get(...)
              ...
          - pattern: |
              ...
              $A = $REQ.headers.getlist(...)[...]
              ...
          - pattern: |
              ...
              $A = $REQ.headers.keys(...)[...]
              ...
          - pattern: |
              ...
              $A = $REQ.args.get(...)
              ...
          - pattern: |
              ...
              $A = $REQ.args.getlist(...)[...]
              ...
          - pattern: |
              ...
              $A = $REQ.query_string.decode(...)
              ...

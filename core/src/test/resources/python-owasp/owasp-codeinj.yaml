rules:
  - id: owasp-codeinj
    languages: [python]
    severity: ERROR
    message: "Tainted request data reaches a code-execution sink (code injection / CWE-94)"
    metadata:
      cwe: CWE-94
    patterns:
      - pattern: |
          $REQ = flask.request
          ...
      - pattern-either:
          - pattern: |
              ...
              eval($A)
          - pattern: |
              ...
              exec($A)
      - pattern-either:
          - pattern: |
              ...
              $A = $REQ.cookies.get(...)
              ...
          - pattern: |
              ...
              $A = $REQ.form.get(...)
              ...
          - pattern: |
              ...
              $A = $REQ.form.getlist(...)
              ...
          - pattern: |
              ...
              $A = $REQ.form.getlist(...)[...]
              ...
          - pattern: |
              ...
              $A = $REQ.form.keys(...)[...]
              ...
          - pattern: |
              ...
              $A = $REQ.headers.get(...)
              ...
          - pattern: |
              ...
              $A = $REQ.headers.getlist(...)[...]
              ...
          - pattern: |
              ...
              $A = $REQ.args.get(...)
              ...
          - pattern: |
              ...
              $A = $REQ.args.getlist(...)[...]
              ...
          - pattern: |
              ...
              $A = $REQ.query_string.decode(...)
              ...

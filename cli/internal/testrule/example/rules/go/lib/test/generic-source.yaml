rules:
  - id: generic-taint-source
    options:
      lib: true
    severity: NOTE
    message: Generic untrusted-data marker (taint.Source)
    metadata:
      short-description: Generic test taint source
    languages:
      - go
    mode: taint
    pattern-sources:
      - label: "$UNTRUSTED"
        pattern: |
          import "test/taint"
          taint.Source()

rules:
  - id: generic-taint-sink
    options:
      lib: true
    severity: NOTE
    message: Generic dangerous-operation marker (taint.Sink)
    metadata:
      short-description: Generic test taint sink
    languages:
      - go
    mode: taint
    pattern-sinks:
      - patterns:
          - pattern-inside: |
              import "test/taint"
              ...
          - pattern: taint.Sink($VALUE)
          - focus-metavariable: $VALUE

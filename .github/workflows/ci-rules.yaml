name: CI Rules

on:
  push:
    paths:
      - 'rules/**'
      - 'model/**'
      - '.github/workflows/ci-rules.yaml'
    branches: [ "main" ]
  pull_request:
    paths:
      - 'rules/**'
      - 'model/**'
      - '.github/workflows/ci-rules.yaml'
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-analyzer:
    name: Build analyzer jar
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # JDK 11 mirrors publish-analyzer.yaml, so the jar under test matches the
      # released one and is never built on a newer JDK than the check job runs it on.
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build analyzer jar
        working-directory: core
        run: ./gradlew :projectAnalyzerJar

      - name: Upload analyzer jar
        uses: actions/upload-artifact@v4
        with:
          name: opentaint-analyzer
          path: core/build/libs/opentaint-project-analyzer.jar
          retention-days: 1

  build-autobuilder:
    name: Build autobuilder jar
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # JDK 11 mirrors ci-autobuilder.yaml / publish-autobuilder.yaml.
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build autobuilder jar
        working-directory: core
        run: ./gradlew opentaint-jvm-autobuilder:projectAutoBuilderJar

      - name: Upload autobuilder jar
        uses: actions/upload-artifact@v4
        with:
          name: opentaint-autobuilder
          path: core/opentaint-jvm-autobuilder/build/libs/opentaint-project-auto-builder.jar
          retention-days: 1

  build-go-server:
    name: Build go-ssa-server
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Set up protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build go-ssa-server
        working-directory: core
        run: ./gradlew opentaint-ir:go:buildGoServer

      - name: Upload go-ssa-server
        uses: actions/upload-artifact@v4
        with:
          name: opentaint-go-server
          path: core/opentaint-ir/go/go-ssa-server/go-ssa-server
          retention-days: 1

  check:
    needs: [ build-analyzer, build-autobuilder, build-go-server ]
    runs-on: ubuntu-latest
    container: gitlab/gitlab-runner-helper:ubuntu-x86_64-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: opentaint-autobuilder
          path: opentaint-autobuilder

      - uses: actions/download-artifact@v4
        with:
          name: opentaint-analyzer
          path: opentaint-analyzer

      - uses: actions/download-artifact@v4
        with:
          name: opentaint-go-server
          path: opentaint-go-server

      - name: Mark go-ssa-server executable
        run: chmod +x opentaint-go-server/go-ssa-server

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build tests jar
        run: cd rules/test && ./gradlew :build
        env:
          SEQRA_GITHUB_ACTOR: ${{ secrets.SEQRA_GITHUB_ACTOR }}
          SEQRA_GITHUB_TOKEN: ${{ secrets.SEQRA_GITHUB_TOKEN }}

      - name: Check rules coverage
        run: cd rules/test && ./gradlew :checkRulesCoverage
        env:
          SEQRA_GITHUB_ACTOR: ${{ secrets.SEQRA_GITHUB_ACTOR }}
          SEQRA_GITHUB_TOKEN: ${{ secrets.SEQRA_GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: OpenTaint compile test project
        run: |
          java -jar opentaint-autobuilder/opentaint-project-auto-builder.jar \
               --project-root-dir rules/test \
               --build portable \
               --result-dir ./opentaint-project \
               --logs-file autobuild.log \
               --verbosity debug

      - name: Run OpenTaint analyzer
        env:
          GOIR_SERVER_BINARY: opentaint-go-server/go-ssa-server
        run: |
          java -Xmx8G -Djdk.util.jar.enableMultiRelease=false -Dorg.opentaint.ir.impl.storage.defaultBatchSize=2000 \
               -jar opentaint-analyzer/opentaint-project-analyzer.jar \
               --project opentaint-project/project.yaml --output-dir opentaint-result --verbosity debug \
               --semgrep-rule-set ./rules/ruleset --debug-run-rule-tests

      - name: Show test results
        run: cat opentaint-result/test-result.json

      - name: Upload test results
        if: (!cancelled())
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: opentaint-result/
          retention-days: 1

      - name: Install jq
        run: apt-get update && apt-get install -y jq

      - name: Test result
        run: |
          SUCCESS_COUNT=$(jq '.success | length' opentaint-result/test-result.json)
          SKIPPED_COUNT=$(jq '.skipped | length' opentaint-result/test-result.json)
          FP_COUNT=$(jq '.falsePositive | length' opentaint-result/test-result.json)
          FN_COUNT=$(jq '.falseNegative | length' opentaint-result/test-result.json)

          echo "OK $SUCCESS_COUNT | Skip $SKIPPED_COUNT | FP $FP_COUNT | FN $FN_COUNT"

          FAILURE_COUNT=$(( $SKIPPED_COUNT + $FP_COUNT + $FN_COUNT ))

          if [ "$FAILURE_COUNT" -eq 0 ]; then
            echo "Success"
            exit 0
          else
            echo "Failed: $FAILURE_COUNT"
            exit 1
          fi

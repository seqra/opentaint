name: Validate PR

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - edited

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    runs-on: ubuntu-latest
    container: ubuntu:latest
    name: Title
    permissions:
      pull-requests: read
      statuses: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: amannn/action-semantic-pull-request@v5
        with:
          types: |
            chore
            feat
            fix
            refactor
            revert
            style
            test
          requireScope: true
          subjectPattern: ^[A-Z].+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. Please ensure that the subject
            starts with an uppercase character.
          wip: true

  scope-path-check:
    runs-on: ubuntu-latest
    name: Scope-Path Check
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v4

      - name: Validate scope matches changed paths
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          SCOPE=$(node .github/scripts/scope-contract.cjs title-scopes "$PR_TITLE")

          CHANGED=$(gh pr diff "$PR_NUMBER" --name-only --repo "$GITHUB_REPOSITORY")
          printf '%s\n' "$CHANGED" |
            node .github/scripts/scope-contract.cjs validate-paths "$SCOPE"
          echo "All changed files have the exact scopes '$SCOPE'"
